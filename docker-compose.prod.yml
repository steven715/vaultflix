# Prod override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# or via `task deploy`. Requires Docker Compose v2.24+ (!reset / !override tags).
services:
  vaultflix-api:
    image: ghcr.io/steven715/vaultflix-api:${VAULTFLIX_TAG:-latest}
    build:
      context: .
      # MUST be explicit: compose merges the `build` map with the base file's,
      # so without this prod would inherit base's `dockerfile: Dockerfile.dev`
      # and ship the dev toolchain image instead of the compiled binary.
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${VAULTFLIX_TAG:-dev}
    # Remove base's dev-only settings; use the image's ENTRYPOINT
    command: !reset null
    working_dir: !reset null
    # Prod is always behind nginx → offload byte serving via X-Accel-Redirect.
    # Set here (not in the shared .env) so `npm run dev` — which proxies straight
    # to the API without nginx — keeps the empty default and streams directly.
    environment:
      VIDEO_XACCEL_PREFIX: /internal-video/
    # Replace base's volumes: drop .:/app and the go caches (prod runs the
    # compiled binary, not `go run`). The read-only video mounts are appended
    # afterwards by docker-compose.media.yml, which `task deploy` passes as a
    # later -f — later files merge into this list rather than being erased by
    # the !override above.
    volumes: !override
      - vaultflix-transcode-cache:/var/cache/vaultflix/transcode
  # vaultflix-nginx needs no overrides here: it keeps the base image build and
  # gets its video mounts from docker-compose.media.yml, same as the api.

volumes:
  vaultflix-transcode-cache:
