version: '3'

vars:
  GIT_SHA:
    sh: git rev-parse --short HEAD
  IMAGE_API: ghcr.io/steven715/vaultflix-api
  # Integration tests run under a DEDICATED compose project (-p vaultflix-inttest)
  # so they are fully isolated from the dev/prod `vaultflix` stack: the test stack
  # gets its own ephemeral postgres/minio volumes and never recreates the prod api
  # container (which would swap in the fixture mount and break real video playback)
  # nor pollutes the dev DB. Its `down -v` only removes the isolated project's
  # volumes, so it can never wipe the dev `vaultflix-postgres-data`.
  COMPOSE_TEST: docker compose -p vaultflix-inttest -f docker-compose.yml -f docker-compose.test.yml
  COMPOSE_PROD: docker compose -f docker-compose.yml -f docker-compose.prod.yml

tasks:
  default:
    cmds:
      - task --list

  verify:
    desc: "Gate for the Stop hook: = test-fast"
    cmds:
      - task: test-fast

  test-fast:
    desc: "Fast checks (lint/type/unit) - native"
    cmds:
      - go vet ./...
      - cmd: test -z "$(gofmt -l .)"
        msg: "gofmt found unformatted files, run `task fmt`"
      - go test ./...
      - task: web:typecheck
      - task: web:lint
      - task: web:test

  web:typecheck:
    desc: "TypeScript build/type-check (web)"
    dir: web
    cmds:
      - npx tsc -b

  web:lint:
    desc: "ESLint (web)"
    dir: web
    cmds:
      - npm run lint

  web:test:
    desc: "Vitest unit tests (web)"
    dir: web
    cmds:
      - npm run test

  fmt:
    desc: "Format Go code"
    cmds:
      - gofmt -w .

  lint:
    desc: "Static checks (go vet + eslint)"
    cmds:
      - go vet ./...
      - task: web:lint

  test-integration:
    desc: "Integration tests (clean stack + fixture) - shared by local/CI"
    cmds:
      # Start from a pristine isolated stack every run (removes any stale ephemeral
      # volume from a previous run so the DB is always clean — no cross-run pollution).
      - "{{.COMPOSE_TEST}} --profile test down -v --remove-orphans"
      - "{{.COMPOSE_TEST}} --profile test up -d vaultflix-api"
      - "{{.COMPOSE_TEST}} --profile test run --rm test-runner"
      # -v removes the isolated project's ephemeral volumes only; the dev/prod
      # `vaultflix` project's named volumes are untouched.
      - defer: "{{.COMPOSE_TEST}} --profile test down -v --remove-orphans"

  test-full:
    desc: "Full test = test-fast + test-integration"
    cmds:
      - task: test-fast
      - task: test-integration

  build:api:
    desc: "Build Go API image (SHA-tagged)"
    cmds:
      - docker build --build-arg GIT_SHA={{.GIT_SHA}} -t {{.IMAGE_API}}:{{.GIT_SHA}} -t {{.IMAGE_API}}:latest .

  build:nginx:
    desc: "Build nginx image (bundles the web SPA as an immutable artifact)"
    cmds:
      - docker build -t vaultflix-nginx:{{.GIT_SHA}} -f nginx/Dockerfile .

  build:
    desc: "Build API + nginx image"
    cmds:
      - task: build:api
      - task: build:nginx

  push:api:
    desc: "Push API image to GHCR (requires docker login ghcr.io first)"
    deps: [build:api]
    cmds:
      - docker push {{.IMAGE_API}}:{{.GIT_SHA}}
      - docker push {{.IMAGE_API}}:latest

  deploy:
    desc: "Deploy to local machine (prod compose). nginx image bundles the web SPA"
    cmds:
      - "{{.COMPOSE_PROD}} build vaultflix-api vaultflix-nginx"
      - "{{.COMPOSE_PROD}} up -d"

  up:
    desc: "Start dev stack"
    cmds:
      - docker compose up -d

  down:
    desc: "Stop dev stack"
    cmds:
      - docker compose down

  logs:
    desc: "Tail api logs"
    cmds:
      - docker compose logs -f vaultflix-api
