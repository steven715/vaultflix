version: '3'

vars:
  GIT_SHA:
    sh: git rev-parse --short HEAD
  # golangci-lint is pinned and lives in the repo's .bin/, so local runs and CI
  # use the same binary whatever else is on PATH (installed on first use).
  GOLANGCI_LINT_VERSION: 2.14.0
  GOLANGCI_LINT_INSTALLER_SHA: 114493f9b3e7257d29e4130f2b4a4aadefbb6845 # commit of tag v2.14.0
  GOLANGCI_LINT: '{{.ROOT_DIR}}/.bin/golangci-lint{{exeExt}}'
  # Integration tests run under a DEDICATED compose project (-p vaultflix-inttest)
  # so they are fully isolated from the everyday `vaultflix` stack: the test stack
  # gets its own ephemeral postgres/minio volumes and never recreates the running
  # api container (which would swap in the fixture mount and break real video
  # playback) nor pollutes the real DB. Its `down -v` only removes the isolated
  # project's volumes, so it can never wipe the `vaultflix` project's postgres data.
  COMPOSE_TEST: docker compose -p vaultflix-inttest -f docker-compose.yml -f docker-compose.test.yml
  # docker-compose.media.yml is per-machine and gitignored (video disk mounts).
  # Integration tests deliberately exclude it — they mount .ci/fixtures instead,
  # so they stay host-OS independent.
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.media.yml
  # Per-test results of the latest test-fast run (gitignored). scripts/cockpit/
  # record.mjs copies them into an evidence pack for the control room.
  TEST_REPORT_DIR: '{{.ROOT_DIR}}/.cockpit/last-run'

tasks:
  default:
    cmds:
      - task --list

  verify:
    desc: "Gate for the Stop hook: = test-fast"
    cmds:
      - task: test-fast

  test-fast:
    desc: "Fast checks (lint/type/unit) - native"
    deps: [golangci-lint:install]
    cmds:
      # Clear the last run's reports first, so a red step never leaves an
      # older green report behind for the evidence pack to pick up.
      - rm -rf "{{.TEST_REPORT_DIR}}"
      - mkdir -p "{{.TEST_REPORT_DIR}}"
      # Kept beside golangci's govet, which runs a different analyzer set.
      - go vet ./...
      # gofmt, import groups and CLAUDE.md's mechanical Go rules (.golangci.yml)
      - '"{{.GOLANGCI_LINT}}" run ./...'
      # Every test event goes to go-test.jsonl; the terminal shows what a plain
      # `go test ./...` would. The reporter's exit code is the verdict (fails
      # closed when go reports no package at all).
      - go test -json ./... 2>&1 | node scripts/cockpit/go-test-report.mjs "{{.TEST_REPORT_DIR}}/go-test.jsonl"
      # The pre-push hook's own filter (which commands get gated).
      - bash scripts/hooks/verify-before-push_test.sh
      # The evidence recorder and the go test reporter.
      - node --test scripts/cockpit/go-test-report.test.mjs scripts/cockpit/record.test.mjs
      - task: web:typecheck
      - task: web:lint
      - task: web:test

  web:typecheck:
    desc: "TypeScript build/type-check (web)"
    dir: web
    cmds:
      - npx tsc -b

  web:lint:
    desc: "ESLint (web)"
    dir: web
    cmds:
      - npm run lint

  web:test:
    desc: "Vitest unit tests (web)"
    dir: web
    cmds:
      # Same console output as before, plus every test's result in vitest.json.
      - npm run test -- --reporter=default --reporter=json --outputFile.json="{{.TEST_REPORT_DIR}}/vitest.json"

  record:
    desc: "Run a command and leave an evidence pack in .cockpit/evidence (e.g. task record -- task test-integration)"
    cmds:
      - node scripts/cockpit/record.mjs -- {{.CLI_ARGS}}

  golangci-lint:install:
    desc: "Install the pinned golangci-lint into .bin/ (skipped when already there)"
    status:
      - '[ "$("{{.GOLANGCI_LINT}}" version --short 2>/dev/null)" = "{{.GOLANGCI_LINT_VERSION}}" ]'
    cmds:
      # The installer script is fetched by commit, not by tag. It checks the
      # archive against the release's own checksums file: that catches a
      # corrupt download, not a tampered release. Needs sh (Git Bash on Windows).
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/{{.GOLANGCI_LINT_INSTALLER_SHA}}/install.sh | sh -s -- -b "{{.ROOT_DIR}}/.bin" v{{.GOLANGCI_LINT_VERSION}}

  fmt:
    desc: "Format Go code (gofmt + import groups)"
    deps: [golangci-lint:install]
    cmds:
      - '"{{.GOLANGCI_LINT}}" fmt ./...'

  lint:
    desc: "Static checks (go vet + golangci-lint + eslint)"
    deps: [golangci-lint:install]
    cmds:
      - go vet ./...
      - '"{{.GOLANGCI_LINT}}" run ./...'
      - task: web:lint

  test-integration:
    desc: "Integration tests (clean stack + fixture) - shared by local/CI"
    cmds:
      # Start from a pristine isolated stack every run (removes any stale ephemeral
      # volume from a previous run so the DB is always clean — no cross-run pollution).
      - "{{.COMPOSE_TEST}} --profile test down -v --remove-orphans"
      # Registered BEFORE the steps it guards: a defer only fires if execution
      # reached it, so placed last it would never run when a step fails and the
      # isolated stack would be left running. -v removes only this project's volumes.
      - defer: "{{.COMPOSE_TEST}} --profile test down -v --remove-orphans"
      - "{{.COMPOSE_TEST}} --profile test up -d --build vaultflix-api"
      # ffmpeg- and Postgres-dependent Go tests; see the go-test service in docker-compose.test.yml.
      - "{{.COMPOSE_TEST}} --profile test run --rm --build go-test"
      - "{{.COMPOSE_TEST}} --profile test run --rm test-runner"

  test-full:
    desc: "Full test = test-fast + test-integration"
    cmds:
      - task: test-fast
      - task: test-integration

  up:
    desc: "Build and (re)start the stack — run again after code changes"
    preconditions:
      - sh: test -f docker-compose.media.yml
        msg: |
          docker-compose.media.yml not found. It holds this machine's video disk
          mounts and is gitignored on purpose. Create it with:
            cp docker-compose.media.yml.example docker-compose.media.yml
          then edit it to point at your own disks.
    env:
      GIT_SHA: "{{.GIT_SHA}}"
    cmds:
      - "{{.COMPOSE}} up -d --build"

  down:
    desc: "Stop the stack"
    cmds:
      - "{{.COMPOSE}} down"

  logs:
    desc: "Tail api logs"
    cmds:
      - "{{.COMPOSE}} logs -f vaultflix-api"

  reset-admin-password:
    desc: "Reset the admin password to ADMIN_DEFAULT_PASSWORD from .env"
    preconditions:
      - sh: test -f docker-compose.media.yml
        msg: |
          docker-compose.media.yml not found. It holds this machine's video disk
          mounts and is gitignored on purpose. Create it with:
            cp docker-compose.media.yml.example docker-compose.media.yml
          then edit it to point at your own disks.
    env:
      GIT_SHA: "{{.GIT_SHA}}"
    cmds:
      # The image ENTRYPOINT is the compiled binary, so the flag goes as an arg.
      - "{{.COMPOSE}} run --rm --no-deps --build vaultflix-api -reset-admin-password"
