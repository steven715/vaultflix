name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install golangci-lint (version pinned in Taskfile.yml)
        run: task golangci-lint:install
      - name: Install web deps
        run: npm --prefix web ci
      - name: Run fast checks (golangci-lint, go test, tsc, eslint, vitest)
        run: task verify

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare .env
        run: cp .env.example .env
      - name: Run integration tests
        run: task test-integration

