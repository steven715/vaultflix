name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache golangci-lint (binary + analysis)
        uses: actions/cache@v4
        with:
          path: |
            .bin
            ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('Taskfile.yml', '.golangci.yml', 'go.sum') }}
      - name: Install web deps
        run: npm --prefix web ci
      - name: Run fast checks (golangci-lint, go test, tsc, eslint, vitest)
        run: task verify

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare .env
        run: cp .env.example .env
      - name: Run integration tests
        run: task test-integration

