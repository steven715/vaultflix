services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Community fork (SILO): upstream minio/minio was pulled from Docker Hub and
    # Quay (2026-09) and no longer receives CVE fixes. Bundles `mc` for the healthcheck.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set vaultflix http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb --ignore-existing vaultflix/${MINIO_VIDEO_BUCKET};
      mc mb --ignore-existing vaultflix/${MINIO_THUMBNAIL_BUCKET};
      mc mb --ignore-existing vaultflix/${MINIO_PREVIEW_BUCKET};
      echo 'Buckets created successfully';
      "

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
        "up"
      ]

  vaultflix-api:
    # Compiled-binary image (Dockerfile's default runtime stage). After a code
    # change, `task up` rebuilds it; BuildKit cache mounts keep that incremental.
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    # The stack always runs behind nginx → offload byte serving via X-Accel-Redirect.
    # Set here (not in .env) so it wins over env_file. Anything that talks to the
    # api directly instead of through nginx must clear it — see
    # docker-compose.test.yml; `npm run dev` proxies via nginx (:3000) instead.
    environment:
      VIDEO_XACCEL_PREFIX: /internal-video/
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - vaultflix-transcode-cache:/var/cache/vaultflix/transcode
      # 影片來源目錄是「因機器而異」的設定，住在 gitignore 的
      # docker-compose.media.yml（見 docker-compose.media.yml.example）。
      # 它用 YAML anchor 一次餵給 api 與 nginx，不必兩邊手動同步。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  vaultflix-nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      vaultflix-api:
        condition: service_healthy
    ports:
      - "3000:80"
    # X-Accel offload: nginx reads video bytes off disk directly, so it needs
    # the SAME read-only mounts as vaultflix-api. Both are supplied together by
    # docker-compose.media.yml, so they can no longer drift apart.
    healthcheck:
      # Pin IPv4: nginx.conf only `listen 80` (IPv4); `localhost` resolves to
      # ::1 first in the container and would fail with connection refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  test-runner:
    image: alpine:3.20
    profiles: ["test"]
    depends_on:
      vaultflix-api:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    entrypoint: sh -c "apk add --no-cache curl jq bash && bash /scripts/test_all.sh"

volumes:
  postgres_data:
  minio_data:
  vaultflix-transcode-cache:
