# Integration test override. Shared by local and CI for parity.
# Usage: docker compose -p vaultflix-inttest -f docker-compose.yml -f docker-compose.test.yml --profile test up ...
# or via `task test-integration`. Requires Docker Compose v2.24+ (!override tags).
services:
  # DB / MinIO become ephemeral (no named volume): every `up` is a clean environment.
  # ports !override []: the test stack talks to postgres/minio/api over the compose
  # network by service name (API_BASE=http://vaultflix-api:8080), so it never needs to
  # publish host ports. Dropping them lets integration run alongside a running
  # `vaultflix` stack (which already holds 5432/9000/8080) without a port conflict.
  postgres:
    volumes: !override []
    ports: !override []
  minio:
    volumes: !override []
    ports: !override []

  vaultflix-api:
    # Same compiled image as the everyday stack — the tests exercise the real artifact.
    # test_all.sh hits the api directly (not via nginx), so stream bytes must be
    # served by the api itself: clear the X-Accel offload set in the base file.
    environment:
      VIDEO_XACCEL_PREFIX: ""
    # Replace the base mounts with the repo-internal fixture: host-OS independent
    volumes: !override
      - ./.ci/fixtures:/mnt/host/videos:ro
    ports: !override []

  # Go tests the native verify gate can't run: ffmpeg-dependent ones (HLS
  # segment/manifest alignment) and repository tests that need a real Postgres.
  # This runs them on the Dockerfile `dev` stage — the same ffmpeg package set
  # the runtime image ships — on the stack's network, after migrations ran.
  go-test:
    build:
      context: .
      target: dev
    profiles: ["test"]
    working_dir: /app
    environment:
      GOTOOLCHAIN: auto
      # Turn a missing-ffmpeg skip into a failure: this step exists to run those tests.
      VAULTFLIX_REQUIRE_FFMPEG: "1"
      # Repository tests run real SQL against the stack's migrated Postgres (ADR-0012);
      # same turn-skip-into-failure switch as ffmpeg.
      VAULTFLIX_TEST_DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      VAULTFLIX_REQUIRE_DB: "1"
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    # -count=1: the go test cache doesn't key on the ffmpeg binary, so a cached PASS
    # would replay without executing ffmpeg after an image/ffmpeg bump.
    command: ["go", "test", "-count=1", "./internal/streaming/", "./internal/repository/"]

  test-runner:
    # The scripts log in as admin; the password must match the seeded admin
    # (ADMIN_DEFAULT_PASSWORD), otherwise login returns 401 and every suite fails.
    environment:
      ADMIN_PASS: "${ADMIN_DEFAULT_PASSWORD:-1234}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"

volumes:
  go_modules:
  go_build_cache:
